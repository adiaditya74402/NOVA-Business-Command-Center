kind = "web"
previewPath = "/"
title = "NOVA — Smart Business Command Center"
description = "A responsive business intelligence dashboard for exploring sales performance, campaign analytics, customer insights, reports, and interactive planning tools."
version = "1.0.0"
id = "artifacts/nova-command-center"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22610

[services.development]
run = "pnpm --filter @workspace/nova-command-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nova-command-center", "run", "build" ]
serve = "static"
publicDir = "artifacts/nova-command-center/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22610"
BASE_PATH = "/"
